name: fleet-build
on:
  workflow_dispatch:
concurrency:
  group: fleet-build
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  build:
    # Pinned to the nix-fleet revision this repository's flake locks.
    uses: Shrub24/nix-fleet/.github/workflows/build-push-cache.yml@ddd024ab14506baecc585f9520e02c1178dfa5d5
    with:
      targets: .#ciRoot
      systems: x86_64-linux
      runner_system: x86_64-linux
      profile: ci
    secrets:
      BUILDER_SSH_KEY: ${{ secrets.FLEET_BUILDER_SSH_KEY }}
