name: Validate
on:
  pull_request:
permissions:
  contents: read
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix flake check --no-build --no-write-lock-file

  checks-build:
    # Builds the cheap derivation checks that `nix flake check --no-build` skips
    # (--no-build = "Do not build checks"). These actually compile/run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix build .#checks.x86_64-linux.statix .#checks.x86_64-linux.deadnix .#checks.x86_64-linux.treefmt
