name: pipeline
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_pr:
        description: "Pull request number to validate"
        required: true
        type: string
permissions:
  contents: read
jobs:
  pipeline:
    uses: Shrub24/nix-fleet/.github/workflows/pipeline.yml@ddd024ab14506baecc585f9520e02c1178dfa5d5
    with:
      source_pr: ${{ inputs.source_pr }}
    permissions:
      contents: write
      statuses: write
      pull-requests: write
      id-token: write
    secrets: inherit
