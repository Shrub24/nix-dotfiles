name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    # The merge ref is not the revision under test: validate the pull request head.
    uses: Shrub24/nix-fleet/.github/workflows/validate.yml@ddd024ab14506baecc585f9520e02c1178dfa5d5
    with:
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      generated_files: check
