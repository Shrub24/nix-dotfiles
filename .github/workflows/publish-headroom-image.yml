name: publish-headroom-image

on:
  workflow_dispatch:
    inputs:
      headroom_build_version:
        description: Optional HEADROOM_BUILD_VERSION override passed to the upstream Dockerfile build.
        required: false
        type: string
  push:
    paths:
      - .github/workflows/publish-headroom-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/shrub24/headroom
  # renovate: datasource=github-releases depName=headroomlabs-ai/headroom versioning=semver
  HEADROOM_VERSION: "0.31.0"

jobs:
  publish:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        run: |
          image_ref="${IMAGE_REPOSITORY}:${HEADROOM_VERSION}-code"
          {
            echo "image-ref=${image_ref}"
            echo "git-context=https://github.com/headroomlabs-ai/headroom.git#v${HEADROOM_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build args
        id: build-args
        env:
          HEADROOM_BUILD_VERSION: ${{ inputs.headroom_build_version || '' }}
        run: |
          {
            echo 'args<<EOF'
            echo 'HEADROOM_EXTRAS=proxy,code'
            echo 'RUNTIME_USER=nonroot'
            if [ -n "$HEADROOM_BUILD_VERSION" ]; then
              echo "HEADROOM_BUILD_VERSION=$HEADROOM_BUILD_VERSION"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Headroom image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.git-context }}
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image-ref }}
          build-args: ${{ steps.build-args.outputs.args }}
