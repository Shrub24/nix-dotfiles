# Pi-native adaptation of Starship's Catppuccin Powerline preset.
format = "[](red)$brand$provider$model[](bg:peach fg:red)$directory$nix_shell[](bg:yellow fg:peach)$git_branch$git_status$git_state[](fg:yellow bg:green)$thinking$activity[](fg:green bg:sapphire)$context$tokens$cache$cost[](fg:sapphire bg:lavender)$turn$time[](fg:lavender)"
palette = "catppuccin_mocha"

[brand]
format = "[ $symbol ]($style)"
symbol = ""
style = "fg:crust bg:red bold"

[model]
format = "[$model ]($style)"
symbol = ""
style = "fg:crust bg:red bold"

[directory]
format = "[ $path ]($style)"
symbol = ""
style = "fg:crust bg:peach bold"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $symbol $branch ]($style)"
symbol = ""
style = "fg:crust bg:yellow bold"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "fg:crust bg:yellow bold"

[thinking]
format = "[ $symbol $level ]($style)"
symbol = "󰔟"
style = "fg:crust bg:green bold"

[activity]
format = "[ $text ]($style)"
symbol = "󰑮"
style = "fg:crust bg:green bold"

[context]
format = "[ $symbol $tokens/$window ($percentage) ](fg:crust bg:sapphire bold)"
symbol = "󰍛"

[[context.display]]
threshold = 0
style = "sapphire"
hidden = false

[provider]
format = "[$provider ]($style)"
style = "fg:crust bg:red bold"
provider_aliases = { omniroute = "or" }

[tokens]
format = "[ \u2191$input \u2193$output ]($style)"
style = "fg:crust bg:sapphire"
symbol = ""

[cache]
disabled = false
format = "[ CH$rate ]($style)"
style = "fg:crust bg:sapphire"

[cost]
format = "[ \\$$cost ](fg:crust bg:sapphire bold)"

[turn]
format = "[ #$count ]($style)"
style = "fg:crust bg:lavender bold"

[nix_shell]
format = "[ $symbol$state ]($style)"
style = "fg:crust bg:peach bold"

[git_state]
format = "[ $state ]($style)"
style = "fg:crust bg:yellow bold"

[time]
format = "[  $time ]($style)"
symbol = ""
style = "fg:crust bg:lavender bold"

[palettes.catppuccin_mocha]
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
sapphire = "#74c7ec"
lavender = "#b4befe"
crust = "#11111b"

