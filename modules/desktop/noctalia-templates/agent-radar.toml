# Radar's palette, rendered by Noctalia.
#
# A rendered file *is* the theme, so these are literal colours: Noctalia
# rewrites them when the wallpaper or the mode changes, and Radar reads a hex
# value as the theme's own colour rather than falling back to an ANSI slot.
# Colour is how a radar row signals its state and shape agrees with it, so the
# accent roles are spent on the lifecycle and the chrome takes the neutral
# families. A role here holds its contrast in both modes, which the `*_fixed`
# tiers do not: those are a light scheme's fills, paired with ink of their own.
# The vendor table and the mark animations are Radar's own, so they stay out
# and this file remains a diff against its defaults.
[colors]
# Group labels: the panel's own ink, drawn bold, as Radar's default has it.
heading = "{{colors.on_surface.default.hex}}"
border = "{{colors.outline.default.hex}}"
subtle = "{{colors.on_surface_variant.default.hex}}"
muted = "{{colors.on_surface.default.hex}}"
# A lifecycle the source did not report: nothing is known, so the neutral tier.
unknown = "{{colors.on_surface_variant.default.hex}}"
done = "{{colors.tertiary.default.hex}}"
working = "{{colors.primary.default.hex}}"
# Held elsewhere, and held on the owner: one hue, two tiers of it.
waiting = "{{colors.on_secondary_container.default.hex}}"
blocked = "{{colors.secondary.default.hex}}"
# Converging on done, so it wears the paired tier of the hue done wears.
settling = "{{colors.on_tertiary_container.default.hex}}"
# Not current: the second-rank ink a retained row's own text is drawn in.
retained = "{{colors.on_surface_variant.default.hex}}"
failed = "{{colors.error.default.hex}}"
selection = "{{colors.surface_container_high.default.hex}}"
