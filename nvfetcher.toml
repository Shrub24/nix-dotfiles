# nvfetcher.toml — declarative package source definitions
#
# nvfetcher generates pkgs/_sources/generated.nix + generated.json
# with up-to-date version, URL, and hash metadata.
#
# Run: nix run .#nvfetcher-update
# Or:  nix develop -c nvfetcher -c nvfetcher.toml -o pkgs/_sources
#
# Excluded packages (managed by other workflows):
#   hermes-agent-src   — separate flake input (flake = false)
#   fish plugin inputs — separate flake inputs (flake = false)

[xberg-cli]
src.github = "xberg-io/xberg"
fetch.url = "https://github.com/xberg-io/xberg/releases/download/$ver/xberg-cli-x86_64-unknown-linux-gnu.tar.gz"

[codexbar]
src.github = "steipete/CodeXBar"
fetch.url = "https://github.com/steipete/CodeXBar/releases/download/$ver/CodexBarCLI-$ver-linux-x86_64.tar.gz"

# Upstream ships only a rolling stable URL; the version file pins the number.
[byterover-cli]
src.webpage = "https://storage.googleapis.com/brv-releases/channels/stable/version"
src.regex = "[0-9.]+"
fetch.url = "https://storage.googleapis.com/brv-releases/channels/stable/brv-linux-x64.tar.gz"
