# nvfetcher.toml — declarative package source definitions
#
# nvfetcher generates pkgs/_sources/generated.nix + generated.json
# with up-to-date version, URL, and hash metadata.
#
# Run: nix run .#nvfetcher-update
# Or:  nix develop -c nvfetcher -c nvfetcher.toml -o pkgs/_sources
#
# Excluded packages (managed by other workflows):
#   hermes-agent-src   — separate flake input (flake = false)
#   fish plugin inputs — separate flake inputs (flake = false)

[xberg-cli]
src.github = "xberg-io/xberg"
fetch.url = "https://github.com/xberg-io/xberg/releases/download/$ver/xberg-cli-x86_64-unknown-linux-gnu.tar.gz"

[codexbar]
src.github = "steipete/CodeXBar"
fetch.url = "https://github.com/steipete/CodeXBar/releases/download/$ver/CodexBarCLI-$ver-linux-x86_64.tar.gz"

# Upstream ships only a rolling stable URL; the version file pins the number.
[byterover-cli]
src.webpage = "https://storage.googleapis.com/brv-releases/channels/stable/version"
src.regex = "[0-9.]+"
fetch.url = "https://storage.googleapis.com/brv-releases/channels/stable/brv-linux-x64.tar.gz"

# OmniRoute publishes no releases, so the pin tracks the deploy/edge branch's
# commit — the line that carries @omniroute/pi-agent.
[omniroute]
src.git = "https://github.com/Shrub24/OmniRoute"
src.branch = "deploy/edge"
fetch.github = "Shrub24/OmniRoute"

# fork-in publishes no releases either, so its pin tracks the default branch's
# commit — the fork entrypoint `/fork-in-herdr` is what we compile in.
[fork-in]
src.git = "https://github.com/onsails/fork-in"
src.branch = "master"
fetch.github = "onsails/fork-in"

# Pi-Bolt ships the runtime its AOT build compiles with as a release asset
# beside the tag, and upstream's release workflow asserts the tree's VERSION
# equals that tag, so the tag is the only version the pair is published at.
# Two entries because a package carries one fetcher: the tree and the runtime.
# `pi-bolt-runtime` keeps the tag as its version, so pkgs/pi-bolt strips the
# `bolt-v` prefix for the derivation and the runtime URL needs no rebuilding.
[pi-bolt]
src.github = "opensec-git/Pi-Bolt"
fetch.github = "opensec-git/Pi-Bolt"

[pi-bolt-runtime]
src.github = "opensec-git/Pi-Bolt"
fetch.url = "https://github.com/opensec-git/Pi-Bolt/releases/download/$ver/pi-bolt-runtime-linux-x64.tar.gz"
